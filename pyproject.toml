[project]
name = "italian-grammar-practice-api"
version = "0.1.0"
description = "FastAPI backend for Italian grammar practice exercises"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.111,<1",
    "mlconjug3>=3.11,<4",
    "numpy<2",
    "pydantic>=2.7,<3",
    "setuptools>=70,<81",
    "uvicorn[standard]>=0.29,<1",
]

[build-system]
requires = ["setuptools>=70,<81"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[dependency-groups]
dev = [
    "httpx>=0.27,<1",
    "pytest>=8,<9",
    "textual==0.10.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
